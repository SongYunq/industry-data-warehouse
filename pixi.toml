[workspace]
name = "industry-data-warehouse"
version = "0.1.0"
description = "Inside Airbnb 城市短租数据仓库"
channels = ["conda-forge"]
platforms = ["osx-arm64", "win-64"]

[activation.env]
PYTHONPATH = "src"

[dependencies]
python = "==3.14.10"
streamlit = "==1.67.0"
pymysql = "==1.2.3"
httpx = "==0.28.1"
socksio = "==1.0.0"
python-dotenv = "==1.2.4"

[tasks]
services-up = "python -m warehouse.cli services-up"
services-down = "python -m warehouse.cli services-down"
services-status = "python -m warehouse.cli services-status"
data-fetch = "python -m inside_airbnb.cli fetch"
data-fetch-all = "python -m inside_airbnb.cli fetch"
data-inspect = "python -m inside_airbnb.cli inspect"
data-check = "python -m inside_airbnb.cli check"
dashboard = "python -m inside_airbnb.cli dashboard"
