[workspace]
name = "industry-data-warehouse"
version = "0.1.0"
description = "H&M 快时尚零售数据仓库"
channels = ["conda-forge"]
platforms = ["osx-arm64", "win-64"]

[activation.env]
PYTHONPATH = "src"

[dependencies]
python = "==3.14.10"
streamlit = "==1.67.0"
pymysql = "==1.2.3"
httpx = "==0.28.1"
socksio = "==1.0.0"
python-dotenv = "==1.2.4"
six = "==1.17.0"

[tasks]
services-up = "python -m warehouse.cli services-up"
services-down = "python -m warehouse.cli services-down"
services-status = "python -m warehouse.cli services-status"
data-fetch = "python -m hm_recommendations.cli fetch"
data-inspect = "python -m hm_recommendations.cli inspect"
data-check = "python -m hm_recommendations.cli check"
data-load = "python -m hm_recommendations.cli load"
analytics-install = "python -m hm_recommendations.analytics"
metabase-publish = "python -m hm_recommendations.metabase"
dashboard = "python -m hm_recommendations.cli dashboard"

[pypi-dependencies]
kaggle = "==2.2.5"
