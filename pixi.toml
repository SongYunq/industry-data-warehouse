[workspace]
name = "industry-data-warehouse"
version = "0.1.0"
description = "国内快递物流末端揽派数据仓库系统（LaDe 数据集）"
channels = ["conda-forge"]
platforms = ["osx-arm64", "win-64"]

[activation.env]
PYTHONPATH = "src"

[dependencies]
python = "==3.14.10"
streamlit = "==1.67.0"
pymysql = "==1.2.3"
httpx = "==0.28.1"
socksio = "==1.0.0"
python-dotenv = "==1.2.4"

[tasks]
services-up = "python -m warehouse.cli services-up"
services-down = "python -m warehouse.cli services-down"
services-status = "python -m warehouse.cli services-status"
doctor = "python -m warehouse.cli doctor"
data-fetch = "python -m warehouse.cli data-fetch"
data-inspect = "python -m warehouse.cli data-inspect"
db-init = "python -m warehouse.cli db-init"
data-import = "python -m warehouse.cli data-import"
data-check = "python -m warehouse.cli data-check"
dashboard = "python -m warehouse.cli dashboard"
